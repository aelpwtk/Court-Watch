name: Court watch

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub starts these late; runs queue so they never overlap
  workflow_dispatch:           # manual "Run workflow" button

permissions:
  contents: write              # lets the bot save its state files back to the repo

concurrency:
  group: court-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Watch both clubs (checks every minute for ~13 min)
        run: python3 watch_loop.py
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ACE_USER: ${{ secrets.ACE_USER }}
          ACE_PASS: ${{ secrets.ACE_PASS }}
          LOOP_SECONDS: 1680

      - name: Save state
        if: always()
        run: |
          git config user.name "court-bot"
          git config user.email "court-bot@users.noreply.github.com"
          git add state*.json || true
          git diff --cached --quiet && exit 0
          git commit -m "court-watch: update state"
          git pull --rebase
          git push
