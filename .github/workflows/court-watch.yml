name: Court watch

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub starts these late; runs queue so they never overlap
  workflow_dispatch:           # manual "Run workflow" button

permissions:
  contents: write              # lets the bot save its state files back to the repo
  actions: write               # lets a run queue its own successor (self-chaining)

concurrency:
  group: court-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest flips to 26.04 on Oct 19
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      # Self-chaining: queue the NEXT run right now. It waits in the concurrency group and starts the
      # moment this one ends, so coverage no longer depends on GitHub's flaky cron. The cron stays as a backup.
      # Only one run can be pending, so this never piles up.
      - name: Queue next run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/court-watch.yml/dispatches" \
            -f ref="${{ github.event.repository.default_branch }}" && echo "Next run queued."

      - name: Watch Challenge (checks every minute for ~13 min)
        run: python3 watch_loop.py
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_SHARED: ${{ secrets.NTFY_TOPIC_SHARED }}   # optional: court alerts only, for sharing
          LOOP_SECONDS: 1680

      - name: Save state
        if: always()
        run: |
          git config user.name "court-bot"
          git config user.email "court-bot@users.noreply.github.com"
          git add state*.json || true
          git diff --cached --quiet && exit 0
          git commit -m "court-watch: update state"
          # Overlapping runs can both edit state.json; on conflict keep this run state (the newer one) and retry
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          exit 1
