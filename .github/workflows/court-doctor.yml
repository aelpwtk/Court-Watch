name: Court doctor

on:
  schedule:
    - cron: "*/20 * * * *"   # checks the watcher every ~20 min; GitHub may start it a few minutes late
  workflow_dispatch:

permissions:
  contents: write            # saves doctor_state.json
  actions: write             # can start / cancel Court watch runs

concurrency:
  group: court-doctor
  cancel-in-progress: false

jobs:
  doctor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Run doctor
        run: python3 doctor.py
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save doctor state
        if: always()
        run: |
          git config user.name "court-doctor"
          git config user.email "court-doctor@users.noreply.github.com"
          git add doctor_state.json || true
          git diff --cached --quiet && exit 0
          git commit -m "court-doctor: update state"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          exit 1
